name: cert-rerun

on:
  workflow_call:
    inputs:
      tools-ref:
        description: The slicc-shared-web commit this workflow is called at (the same 40-hex sha as the caller's uses:)
        type: string
        required: true
      approval-label:
        description: The coordinator's approval label whose adding re-runs cert-review
        type: string
        default: cert-review-approved
      workflow:
        description: The caller's cert-review workflow path (the run to re-run)
        type: string
        default: .github/workflows/cert-review.yml

permissions: {}

jobs:
  rerun:
    name: re-run cert-review
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && (github.event.action == 'ready_for_review' || (github.event.action == 'labeled' && github.event.label.name == inputs.approval-label) || (github.event.action == 'edited' && github.event.changes.base))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: cert-rerun-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: write
    steps:
      - name: Main's tools at the pinned sha (no checkout of the pull request, no token)
        env:
          TOOLS_REF: ${{ inputs.tools-ref }}
        run: |
          [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "cert-rerun: FAIL tools-ref is not a sha"; exit 1; }
          git init -q .cert-tools
          git -C .cert-tools fetch -q --depth 1 --no-tags https://github.com/ai-ecoverse/slicc-shared-web "$TOOLS_REF"
          git -C .cert-tools checkout -q FETCH_HEAD -- .github/cert-review

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - name: Re-run every job of the newest cert-review run on this head (cancelling one still running first)
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL: ${{ inputs.approval-label }}
          CERT_WORKFLOW: ${{ inputs.workflow }}
        run: node .cert-tools/.github/cert-review/rerun.mjs
