name: Node Release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      lint:
        type: string
        default: npm run lint
      chromium:
        type: boolean
        default: false
      test:
        type: string
        default: npm test

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        env:
          LINT: ${{ inputs.lint }}
        run: bash -c "$LINT"

      - name: Chromium system dependencies
        if: inputs.chromium
        run: npx playwright-core install-deps chromium

      - name: Tests
        env:
          TEST: ${{ inputs.test }}
        run: bash -c "$TEST"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shim="$RUNNER_TEMP/git-retry"
          mkdir -p "$shim"
          cat > "$shim/git" <<'EOF'
          #!/usr/bin/env node
          const { spawnSync } = require('node:child_process');
          const git = process.env.REAL_GIT;
          const args = process.argv.slice(2);
          const retry = ['push', 'fetch'].includes(args[0]) && !args.includes('--unshallow');
          const attempts = retry ? 5 : 1;
          const delay = Number(process.env.GIT_RETRY_DELAY_MS ?? 5000);
          for (let attempt = 1; ; attempt++) {
            const result = spawnSync(git, args, { stdio: 'inherit' });
            if (result.error) console.error(`git-retry: ${result.error.message}`);
            const status = result.status ?? 1;
            if (status === 0 || attempt === attempts) process.exit(status);
            console.error(`git-retry: git ${args[0]} failed, attempt ${attempt} of ${attempts}`);
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, delay * attempt);
          }
          EOF
          chmod +x "$shim/git"
          REAL_GIT="$(command -v git)" PATH="$shim:$PATH" npx semantic-release
