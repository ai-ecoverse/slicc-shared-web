name: Node Release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      lint:
        type: string
        default: npm run lint
      chromium:
        type: boolean
        default: false
      test:
        type: string
        default: npm test

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        env:
          LINT: ${{ inputs.lint }}
        run: bash -c "$LINT"

      - name: Chromium system dependencies
        if: inputs.chromium
        run: npx playwright-core install-deps chromium

      - name: Tests
        env:
          TEST: ${{ inputs.test }}
        run: bash -c "$TEST"

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
