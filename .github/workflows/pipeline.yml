name: Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      runs-on:
        type: string
        default: cloud-run-job
      timeout-minutes:
        type: number
        default: 20
      lint:
        type: string
        default: npm run lint
      chrome:
        type: string
        default: ''
      test:
        type: string
        default: npm test
      test-glob:
        type: string
        default: test/integration/**/*.test.mjs
      shards:
        type: number
        default: 4
      deploy:
        type: string
        default: ''
      deploy-secrets:
        type: string
        default: ''
      review-browser:
        type: string
        default: npm run --if-present review:browser
      review-prompt:
        type: string
        default: ''
      review-renovate:
        type: string
        default: ''
      node-options:
        type: string
        default: ''
      require-tests:
        type: boolean
        default: true
      review-timeout-minutes:
        type: number
        default: 60
      review-screenshots:
        type: number
        default: 30
      release-environment:
        type: string
        default: ''
      after-release:
        type: string
        default: ''
      release-secrets:
        type: string
        default: ''
      attest:
        type: string
        default: ''
      artifacts:
        type: string
        default: ''
    secrets:
      AWS_BEARER_TOKEN_BEDROCK:
        required: false
      SLICC_ISSUES_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read

env:
  LEFTHOOK: '0'
  FINDINGS_SCHEMA: >-
    {"type":"object","additionalProperties":false,"required":["verdict","summary","comments","issues"],"properties":{"verdict":{"type":"string","enum":["approved","denied"]},"summary":{"type":"string"},"comments":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["path","line","body"],"properties":{"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}}}},"issues":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["repo","title","body"],"properties":{"repo":{"type":"string"},"title":{"type":"string"},"body":{"type":"string"}}}}}}

jobs:
  lint:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      total: ${{ steps.shards.outputs.total }}
      review: ${{ steps.review.outputs.review }}
      bedrock: ${{ steps.bedrock.outputs.bedrock }}
      split: ${{ steps.split.outputs.split }}
      files: ${{ steps.split.outputs.files }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        env:
          LINT: ${{ inputs.lint }}
        run: bash -eo pipefail -c "$LINT"

      - id: shards
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          total=$(( SHARDS > 1 ? SHARDS : 1 ))
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "shards=$(node -p "JSON.stringify([...Array($total).keys()])")" >> "$GITHUB_OUTPUT"

      - id: queued
        if: github.event_name != 'push'
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477
        continue-on-error: true
        with:
          name: ^junit-
          name_is_regexp: true
          event: merge_group
          workflow_conclusion: completed
          if_no_artifact_found: ignore
          path: ${{ runner.temp }}/junit-download

      - if: github.event_name != 'push' && steps.queued.outputs.found_artifact != 'true'
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477
        continue-on-error: true
        with:
          name: ^junit-
          name_is_regexp: true
          event: pull_request
          workflow_conclusion: completed
          if_no_artifact_found: ignore
          path: ${{ runner.temp }}/junit-download

      - id: split
        if: github.event_name != 'push'
        shell: bash
        env:
          GLOB: ${{ inputs.test-glob }}
          TOTAL: ${{ steps.shards.outputs.total }}
        run: |
          node --input-type=module <<'EOF' | tee -a "$GITHUB_OUTPUT"
          import { globSync, readFileSync } from 'node:fs';
          const { GLOB, TOTAL, RUNNER_TEMP } = process.env;
          const files = globSync(GLOB, { exclude: (file) => file.includes('node_modules') }).sort();
          const seconds = new Map();
          for (const report of globSync(`${RUNNER_TEMP}/junit-download/**/*.xml`)) {
            for (const [, attrs] of readFileSync(report, 'utf8').matchAll(/<testcase\b([^>]*?)\/?>/g)) {
              const path = /\bfile="([^"]*)"/.exec(attrs)?.[1] ?? '';
              const file = files.find((candidate) => path === candidate || path.endsWith(`/${candidate}`));
              if (file) seconds.set(file, (seconds.get(file) ?? 0) + Number(/\btime="([^"]*)"/.exec(attrs)?.[1] ?? 0));
            }
          }
          const walls = new Map();
          for (const report of globSync(`${RUNNER_TEMP}/junit-download/**/*.times`)) {
            for (const line of readFileSync(report, 'utf8').split('\n').filter(Boolean)) {
              const { file, ms } = JSON.parse(line);
              if (files.includes(file)) walls.set(file, (walls.get(file) ?? 0) + ms / 1000);
            }
          }
          for (const [file, wall] of walls) seconds.set(file, wall);
          const known = [...seconds.values()];
          const guess = known.length ? known.reduce((a, b) => a + b, 0) / known.length : 1;
          const weight = (file) => seconds.get(file) ?? guess;
          const shards = Array.from({ length: Number(TOTAL) }, () => ({ load: 0, files: [] }));
          for (const file of [...files].sort((a, b) => weight(b) - weight(a) || a.localeCompare(b))) {
            const lightest = shards.reduce((min, shard) => (shard.load < min.load ? shard : min));
            lightest.load += weight(file);
            lightest.files.push(file);
          }
          shards.forEach((shard, i) => console.error(`shard ${i}: ${shard.files.length} files, ~${Math.round(shard.load)} s`));
          console.error(`timings for ${seconds.size} of ${files.length} files, ${walls.size} by wall time`);
          console.log(`split=${JSON.stringify(shards.map((shard) => shard.files.join('\n')))}`);
          console.log(`files=${JSON.stringify(files)}`);
          EOF

      - id: review
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          RENOVATE_GROUPS: ${{ inputs.review-renovate }}
        run: |
          node --input-type=module <<'EOF' | tee -a "$GITHUB_OUTPUT"
          import { matchesGlob } from 'node:path';
          const { EVENT, BRANCH, AUTHOR, SENDER, RENOVATE_GROUPS } = process.env;
          const slug = BRANCH.replace(/^renovate\//, '').replace(/^major-/, '');
          const groups = RENOVATE_GROUPS.split('\n').map((group) => group.trim()).filter(Boolean);
          const renovate = AUTHOR === 'renovate[bot]' && SENDER === 'renovate[bot]' && BRANCH.startsWith('renovate/');
          const review = EVENT === 'pull_request' && (!renovate || groups.some((group) => matchesGlob(slug, group)));
          console.log(`review=${review}`);
          EOF

      - id: bedrock
        env:
          BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK != '' }}
        run: echo "bedrock=$BEDROCK" >> "$GITHUB_OUTPUT"

  deploy:
    needs: lint
    if: inputs.deploy != '' && github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Secrets as environment variables
        env:
          SECRETS: ${{ toJSON(secrets) }}
          DEPLOY_SECRETS: ${{ inputs.deploy-secrets }}
        run: |
          node --input-type=module >> "$GITHUB_ENV" <<'EOF'
          const own = new Set(['github_token', 'AWS_BEARER_TOKEN_BEDROCK', 'SLICC_ISSUES_TOKEN', 'CLOUDFLARE_API_TOKEN']);
          const only = new Set((process.env.DEPLOY_SECRETS ?? '').toUpperCase().split(/\s+/).filter(Boolean));
          for (const [key, value] of Object.entries(JSON.parse(process.env.SECRETS))) {
            if (!own.has(key) && (only.size === 0 || only.has(key))) process.stdout.write(`${key}<<SLICC_EOF\n${value}\nSLICC_EOF\n`);
          }
          EOF

      - id: deploy
        name: Deploy to staging
        env:
          DEPLOY: ${{ inputs.deploy }}
        run: bash -eo pipefail -c "$DEPLOY"

  test:
    needs: [lint, deploy]
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !cancelled() && needs.lint.result == 'success' && needs.deploy.result != 'failure'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.lint.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - if: inputs.artifacts != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ${{ inputs.artifacts }}
          path: ${{ runner.temp }}/artifacts

      - name: Chrome
        env:
          CHROME: ${{ inputs.chrome }}
        run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser ${DEPS:+--with-deps} ${CHROME:+--version "$CHROME"}

      - name: Integration tests
        env:
          TEST: ${{ inputs.test }}
          GLOB: ${{ inputs.test-glob }}
          FILES: ${{ fromJSON(needs.lint.outputs.split)[matrix.shard] }}
          SHARD: ${{ matrix.shard }}
          EXTRA_NODE_OPTIONS: ${{ inputs.node-options }}
          STAGING_URL: ${{ needs.deploy.outputs.url }}
          SLICC_ARTIFACTS: ${{ inputs.artifacts != '' && format('{0}/artifacts', runner.temp) || '' }}
        run: |
          shard=node_modules/@ai-ecoverse/slicc-shared-web/harness/shard.cjs
          [ -f "$shard" ] || shard=harness/shard.cjs
          if [ ! -f "$shard" ]; then
            echo "::error title=Integration tests::No harness/shard.cjs: add @ai-ecoverse/slicc-shared-web as a devDependency, at the version of this workflow or later"
            exit 1
          fi
          mkdir -p junit
          SLICC_TEST_FILES=$FILES
          SLICC_TEST_ALL=$(node -e 'for (const file of require("node:fs").globSync(process.argv[1])) console.log(file)' "$GLOB")
          SLICC_TEST_SHARD=$SHARD
          SLICC_TEST_JUNIT=$PWD/junit/$SHARD.xml
          SLICC_TEST_NODE_OPTIONS="${NODE_OPTIONS:-} $EXTRA_NODE_OPTIONS"
          NODE_OPTIONS="$SLICC_TEST_NODE_OPTIONS --require $PWD/$shard --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=$PWD/junit/$SHARD.xml"
          if [ -z "${DISPLAY:-}" ]; then
            if ! command -v Xvfb > /dev/null; then
              if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq xvfb
              elif sudo -n true 2>/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
              else echo "::error title=Display::No Xvfb on $RUNNER_NAME and no root to install it: add xvfb to the runner image"; exit 1
              fi
            fi
            nohup Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
            for _ in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
            export DISPLAY=:99
          fi
          export SLICC_TEST_FILES SLICC_TEST_ALL SLICC_TEST_SHARD SLICC_TEST_JUNIT SLICC_TEST_NODE_OPTIONS NODE_OPTIONS
          bash -eo pipefail -c "$TEST"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: junit-${{ matrix.shard }}
          path: junit/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: integration-${{ matrix.shard }}
          path: |
            coverage/
            artifacts/
            junit/
          if-no-files-found: ignore

  integration:
    needs: [lint, test]
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !cancelled()
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: junit-*
          path: junit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}

      - env:
          RESULT: ${{ needs.test.result }}
          REQUIRE: ${{ inputs.require-tests }}
          FILES: ${{ needs.lint.outputs.files }}
        run: |
          node --input-type=module <<'EOF'
          import { globSync, readFileSync } from 'node:fs';
          const { RESULT, REQUIRE, FILES } = process.env;
          const files = REQUIRE === 'true' ? JSON.parse(FILES || '[]') : [];
          const shards = new Map(files.map((file) => [file, new Set()]));
          const reports = globSync('junit/**/*.xml');
          let tests = 0;
          let skipped = 0;
          let failed = 0;
          for (const report of reports) {
            const xml = readFileSync(report, 'utf8');
            for (const [, attrs, body = ''] of xml.matchAll(/<testcase\b([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g)) {
              if (/file="[^"]*\/slicc-shared-web\/unit\/none\.mjs"/.test(attrs)) continue;
              if (/<skipped\b/.test(body)) {
                skipped += 1;
                continue;
              }
              tests += 1;
              if (/<(failure|error)\b/.test(body)) failed += 1;
            }
          }
          const lists = globSync('junit/**/*.files');
          for (const list of lists) {
            for (const file of readFileSync(list, 'utf8').split('\n')) shards.get(file)?.add(list.split('/')[1]);
          }
          const missing = files.filter((file) => shards.get(file).size === 0);
          const twice = files.filter((file) => shards.get(file).size > 1);
          for (const file of missing) console.log(`::error title=Integration::${file} matches test-glob but ran on no shard`);
          for (const file of twice) console.log(`::error title=Integration::${file} ran on ${[...shards.get(file)].join(', ')}`);
          const why =
            RESULT !== 'success' ? `the test job ended with ${RESULT}`
            : failed > 0 ? `${failed} of ${tests} tests failed`
            : tests === 0 && REQUIRE === 'true' ? 'no test ran (a repo without node tests sets require-tests: false)'
            : files.length > 0 && lists.length === 0 ? 'no shard listed the files it ran (update the @ai-ecoverse/slicc-shared-web devDependency to the version of this workflow)'
            : missing.length > 0 ? `${missing.length} test-glob files ran on no shard`
            : twice.length > 0 ? `${twice.length} test-glob files ran on more than one shard`
            : '';
          const once = files.length - missing.length - twice.length;
          const ran = `${tests} tests${skipped ? ` (${skipped} skipped)` : ''} in ${reports.length} JUnit reports${files.length ? `, ${once} of ${files.length} test-glob files on exactly one shard` : ''}`;
          console.log(why ? `integration: FAIL ${why} (${ran})` : `integration: PASS ${ran}`);
          process.exit(why ? 1 : 0);
          EOF

  context:
    needs: lint
    if: needs.lint.outputs.review == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}

      - name: The pull request, from git and the event
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/context"
          git diff "$BASE...$HEAD" > "$RUNNER_TEMP/context/pr.diff"
          git diff --name-status "$BASE...$HEAD" > "$RUNNER_TEMP/context/files.txt"
          git log --format='%H%x09%an%x09%s' "$BASE..$HEAD" > "$RUNNER_TEMP/context/commits.txt"
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { pull_request: pr } = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const out = { number: pr.number, title: pr.title, body: pr.body, author: pr.user.login, labels: pr.labels.map((label) => label.name), draft: pr.draft, base: pr.base.ref, head: pr.head.ref };
          writeFileSync(`${process.env.RUNNER_TEMP}/context/pr.json`, JSON.stringify(out, null, 2));
          EOF

      - name: Comments, reviews, issues and pull requests, as far as the API allows
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'EOF'
          import { writeFile } from 'node:fs/promises';
          const { GITHUB_API_URL: api, GITHUB_REPOSITORY: repo, GH_TOKEN, PR, RUNNER_TEMP } = process.env;
          const dir = `${RUNNER_TEMP}/context`;
          const missing = [];
          const get = async (path) => {
            for (let attempt = 1; ; attempt += 1) {
              const res = await fetch(`${api}/${path}`, { headers: { authorization: `Bearer ${GH_TOKEN}`, accept: 'application/vnd.github+json' } });
              if (res.ok) return res.json();
              if (attempt === 2) throw new Error(`${path}: ${res.status} ${(await res.text()).slice(0, 200)}`);
              await new Promise((resolve) => setTimeout(resolve, 20000));
            }
          };
          const pages = async (path, most) => {
            const items = [];
            for (let page = 1; page <= most; page += 1) {
              const batch = await get(`${path}${path.includes('?') ? '&' : '?'}per_page=100&page=${page}`);
              items.push(...batch);
              if (batch.length < 100) break;
            }
            return items;
          };
          const save = async (name, what) => {
            try {
              await writeFile(`${dir}/${name}`, JSON.stringify(await what(), null, 2));
            } catch (error) {
              missing.push(`${name}: ${error.message}`);
            }
          };
          await save('comments.json', () => pages(`repos/${repo}/issues/${PR}/comments`, 3));
          await save('reviews.json', () => pages(`repos/${repo}/pulls/${PR}/reviews`, 3));
          await save('review-comments.json', () => pages(`repos/${repo}/pulls/${PR}/comments`, 3));
          let all;
          await save('issues.json', async () => {
            all = await pages(`repos/${repo}/issues?state=all&sort=updated`, 5);
            return all.filter((item) => !item.pull_request).map(({ number, title, state, body, labels, created_at, closed_at }) => ({ number, title, state, body, labels: labels.map((label) => label.name), created_at, closed_at }));
          });
          await save('pulls.json', async () => {
            if (!all) throw new Error('the issues listing it comes from failed');
            return all.filter((item) => item.pull_request).map(({ number, title, state, body, pull_request }) => ({ number, title, state, body, merged_at: pull_request.merged_at }));
          });
          await writeFile(`${dir}/missing.txt`, missing.join('\n'));
          for (const line of missing) console.log(`::warning title=Review context::${line}`);
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: context
          path: ${{ runner.temp }}/context/

  reviewer:
    needs: [lint, test, deploy, context]
    if: needs.lint.outputs.review == 'true' && needs.lint.outputs.bedrock == 'true' && !cancelled() && needs.test.result != 'skipped' && needs.context.result == 'success' && needs.deploy.result != 'failure'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    timeout-minutes: ${{ inputs.review-timeout-minutes }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}

      - run: |
          npm ci
          mv base "$RUNNER_TEMP/base"
          if [ -f "$RUNNER_TEMP/base/package-lock.json" ]; then
            (cd "$RUNNER_TEMP/base" && npm ci)
          else
            echo "the base has no package-lock.json, so its tree stays uninstalled"
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: integration-*
          path: ${{ runner.temp }}/review/integration

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: context
          path: ${{ runner.temp }}/review/context

      - if: inputs.artifacts != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ${{ inputs.artifacts }}
          path: ${{ runner.temp }}/review/artifacts

      - name: Four browsers
        env:
          CHROME: ${{ inputs.chrome }}
          REVIEW_BROWSER: ${{ inputs.review-browser }}
          STAGING_URL: ${{ needs.deploy.outputs.url }}
          SLICC_ARTIFACTS: ${{ inputs.artifacts != '' && format('{0}/review/artifacts', runner.temp) || '' }}
        run: |
          DEPS=
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then DEPS=1; fi
          npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser ${DEPS:+--with-deps} ${CHROME:+--version "$CHROME"}
          browser=$(npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp find-browser ${CHROME:+--version "$CHROME"} | tail -1)
          if [ -z "${DISPLAY:-}" ]; then
            if ! command -v Xvfb > /dev/null; then
              if [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq xvfb
              elif sudo -n true 2>/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
              else echo "::error title=Display::No Xvfb on $RUNNER_NAME and no root to install it: add xvfb to the runner image"; exit 1
              fi
            fi
            nohup Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
            for _ in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
            export DISPLAY=:99
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
          fi
          extension=$GITHUB_WORKSPACE/node_modules/@ai-ecoverse/slicc-shared-web/harness/extension
          [ -f "$extension/manifest.json" ] || extension=$GITHUB_WORKSPACE/harness/extension
          [ -f "$extension/manifest.json" ] || { echo "::error title=Review browsers::No harness/extension: add @ai-ecoverse/slicc-shared-web as a devDependency, at the version of this workflow or later"; exit 1; }
          port=9301
          list=
          for side in head base; do
            for link in extension cli; do
              profile="$RUNNER_TEMP/browser-$side-$link"
              mkdir -p "$profile"
              nohup "$browser" --no-sandbox --no-first-run --no-default-browser-check --window-size=1280,800 \
                --enable-unsafe-extension-debugging --load-extension="$extension" --remote-debugging-port="$port" \
                --user-data-dir="$profile" about:blank > "$profile.log" 2>&1 &
              for _ in $(seq 50); do curl -fs "http://127.0.0.1:$port/json/version" > /dev/null && break; sleep 0.2; done
              tree=$GITHUB_WORKSPACE
              [ "$side" = head ] || tree=$RUNNER_TEMP/base
              if [ -f "$tree/package-lock.json" ]; then
                (cd "$tree" && SLICC_REVIEW_SIDE=$side SLICC_REVIEW_LINK=$link \
                  SLICC_REVIEW_CDP="http://127.0.0.1:$port" bash -eo pipefail -c "$REVIEW_BROWSER")
              else
                echo "the $side has no package-lock.json, so its $link browser stays bare"
              fi
              list="$list{\"side\":\"$side\",\"link\":\"$link\",\"cdp\":\"http://127.0.0.1:$port\",\"tree\":\"$tree\"},"
              port=$((port + 1))
            done
          done
          echo "[${list%,}]" > "$RUNNER_TEMP/review/browsers.json"
          cat "$RUNNER_TEMP/review/browsers.json"

      - name: Prompt
        env:
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          STAGING_URL: ${{ needs.deploy.outputs.url }}
          EXTRA: ${{ inputs.review-prompt }}
          SHOTS: ${{ inputs.review-screenshots }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          mkdir -p "$RUNNER_TEMP/review/shots"
          cat > "$RUNNER_TEMP/review/prompt.txt" <<EOF
          Review pull request $PR of $REPO.

          The working directory holds:
          - .: the pull request's head, dependencies installed, with full history, so git diff BASE...HEAD and git log work (BASE is the base commit: git merge-base HEAD origin/BASE_REF, or the diff in $RUNNER_TEMP/review/context/pr.diff). Your scratch files go in $RUNNER_TEMP/review, never in the checkout.
          - $RUNNER_TEMP/base: its base, to compare with, dependencies installed if it has a package-lock.json; without one its browsers are bare Chrome.
          - $RUNNER_TEMP/review/context/: the pull request (pr.json, pr.diff, files.txt, commits.txt, comments.json, reviews.json, review-comments.json), the repository's issues (issues.json) and recent pull requests (pulls.json). missing.txt names any the GitHub API wouldn't give; read those with gh if you need them.
          - $RUNNER_TEMP/review/integration/: the integration tests' coverage, artifacts (screenshots, CPU profiles, crash dumps, console logs) and JUnit reports, one directory per shard.
          - $RUNNER_TEMP/review/browsers.json: four running headed Chrome instances on the virtual display $DISPLAY, reachable over CDP, one per side (head, base) and link (extension, slicc-cli). The repository's review-browser hook, if it has one, loaded each side's build into them; without one they are bare Chrome. Each also runs slicc-shared-web's harness extension, a content script on every page and frame that sets data-slicc-harness-extension, standing in for the password managers and similar extensions real users have; it is expected, not a finding. Use them to compare the head's behaviour with the base's.
          ${STAGING_URL:+- The service is deployed to staging at $STAGING_URL.}
          ${ARTIFACTS:+- $RUNNER_TEMP/review/artifacts/: the artifacts this run built before the pipeline (those matching $ARTIFACTS), one directory per artifact. The review-browser hook got the same path as SLICC_ARTIFACTS.}

          Read the change, run what you need, and decide whether it should be merged.
          Deny only for a problem you confirmed that users or operators are likely to hit: a security or secret exposure, data loss or corruption, a crash, a regression in a common path, or a behaviour change without a test.
          A race or edge case that needs unlikely timing (a window of seconds, a person acting in the middle of a run) or a rare combination of events doesn't block: approve, describe the scenario in a comment, and add an issue if it's worth tracking.
          Don't deny for a risk the base already has. On a pull request that has been reviewed before (reviews.json, comments.json), deny only for something new and at least as serious as what earlier rounds fixed; don't move from one narrow case to the next.
          Answer with JSON that matches the schema you were given:
          - verdict: "approved" or "denied".
          - summary: a few sentences on the change and your verdict.
          - comments: findings on lines the pull request adds or changes, with path relative to the repository root and the line number in the head.
          - issues: problems worth tracking outside this pull request, each with repo as owner/name, a title and a body.
            Leave out any that $RUNNER_TEMP/review/context/issues.json already has open, even under another title.
          Screenshots: when a finding is about what a page shows, save a PNG to $RUNNER_TEMP/review/shots/ (a name of letters, digits, dots, dashes or underscores; at most $SHOTS files) and put it in the summary, a comment or an issue body as ![what it shows](shots/name.png). They're published with your findings.

          $EXTRA
          EOF

      - id: claude-code
        if: matrix.agent == 'claude'
        env:
          # renovate: datasource=npm depName=@anthropic-ai/claude-code
          CLAUDE_CODE: 2.1.303
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-code" --no-save --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE"
          "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" --version
          echo "path=$RUNNER_TEMP/claude-code/node_modules/.bin/claude" >> "$GITHUB_OUTPUT"

      - id: claude
        if: matrix.agent == 'claude'
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
        with:
          prompt: Follow the instructions in ${{ runner.temp }}/review/prompt.txt.
          use_bedrock: 'true'
          path_to_claude_code_executable: ${{ steps.claude-code.outputs.path }}
          github_token: ${{ github.token }}
          allowed_bots: renovate[bot]
          claude_args: >-
            --model ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
            --add-dir ${{ runner.temp }}/base
            --add-dir ${{ runner.temp }}/review
            --allowedTools Bash,Read,Glob,Grep,WebFetch
            --json-schema '${{ env.FINDINGS_SCHEMA }}'

      - if: matrix.agent == 'claude'
        env:
          FINDINGS: ${{ steps.claude.outputs.structured_output }}
        run: printf '%s' "$FINDINGS" > "$RUNNER_TEMP/review/findings.json"

      - if: matrix.agent == 'codex'
        name: Codex on Bedrock
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          echo 'model_provider = "amazon-bedrock-runtime"' > "$RUNNER_TEMP/codex-home/config.toml"
          echo '{"port":0}' > "$RUNNER_TEMP/codex-home/$GITHUB_RUN_ID.json"

      - if: matrix.agent == 'codex'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
        with:
          prompt-file: ${{ runner.temp }}/review/prompt.txt
          output-file: ${{ runner.temp }}/review/findings.json
          output-schema: ${{ env.FINDINGS_SCHEMA }}
          codex-home: ${{ runner.temp }}/codex-home
          model: ${{ vars.CODEX_BEDROCK_MODEL || 'global.openai.gpt-6.1-sol' }}
          sandbox: danger-full-access
          safety-strategy: ${{ runner.environment == 'github-hosted' && 'drop-sudo' || 'unsafe' }}
          allow-bot-users: renovate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: findings-${{ matrix.agent }}
          path: |
            ${{ runner.temp }}/review/findings.json
            ${{ runner.temp }}/review/shots/
          if-no-files-found: ignore

  post:
    needs: reviewer
    if: '!cancelled() && needs.reviewer.result != ''skipped'''
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: findings-claude
          path: findings/findings-claude

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: findings-codex
          path: findings/findings-codex

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}

      - name: Screenshots to R2
        id: r2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '155ec15a52a18a14801e04b019da5e5a' }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'slicc-pr-screenshots' }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://pub-e4170b327f03406f9831a6f393b96e05.r2.dev' }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          # renovate: datasource=npm depName=wrangler
          WRANGLER: 4.151.0
        run: |
          prefix="$GITHUB_REPOSITORY/pr-$PR/${SHA:0:7}"
          echo "base=$R2_PUBLIC_BASE_URL/$prefix" >> "$GITHUB_OUTPUT"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "no CLOUDFLARE_API_TOKEN, so screenshots stay in the findings artifacts"; exit 0; }
          for dir in findings/findings-*; do
            agent=${dir#findings/findings-}
            : > "$dir/uploaded.txt"
            for f in "$dir"/shots/*.png; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::warning::$name isn't a valid R2 key here; it stays in the artifact"; continue; }
              npx --yes "wrangler@$WRANGLER" r2 object put "$R2_BUCKET/$prefix/$agent/$name" --file "$f" --content-type image/png --remote
              echo "$name" >> "$dir/uploaded.txt"
            done
          done

      - env:
          GH_TOKEN: ${{ github.token }}
          R2_BASE: ${{ steps.r2.outputs.base }}
          ISSUES_TOKEN: ${{ secrets.SLICC_ISSUES_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const { GITHUB_API_URL: api, GITHUB_REPOSITORY: repo, GH_TOKEN, ISSUES_TOKEN, PR, SHA, RUN_URL, R2_BASE } = process.env;
          const call = async (method, path, body, token = GH_TOKEN) => {
            const res = await fetch(`${api}/${path}`, {
              method,
              headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            if (!res.ok) throw new Error(`${method} ${path}: ${res.status} ${await res.text()}`);
            return res.json();
          };
          const post = (path, body, token) => call('POST', path, body, token);
          const pages = async (path, token) => {
            const items = [];
            for (let page = 1; ; page += 1) {
              const batch = await call('GET', `${path}${path.includes('?') ? '&' : '?'}per_page=100&page=${page}`, undefined, token);
              items.push(...batch);
              if (batch.length < 100) return items;
            }
          };
          const said = await pages(`repos/${repo}/issues/${PR}/comments`);
          const inline = await pages(`repos/${repo}/pulls/${PR}/comments`);
          const once = async (body, send) => {
            if (said.some((comment) => comment.body === body) || inline.some((comment) => comment.body === body)) return;
            await send();
          };
          let failed = false;
          for (const agent of ['claude', 'codex']) {
            const findings = await readFile(`findings/findings-${agent}/findings.json`, 'utf8').then(JSON.parse).catch(() => undefined);
            const uploaded = new Set((await readFile(`findings/findings-${agent}/uploaded.txt`, 'utf8').catch(() => '')).split('\n').filter(Boolean));
            const shots = (text) => text.replace(/!\[([^\]]*)\]\((?:\.\/)?shots\/([^)\s]+)\)/g, (_, alt, name) =>
              R2_BASE && uploaded.has(name) ? `![${alt || name}](${R2_BASE}/${agent}/${name})` : `📷 _${alt || name}_ ([\`${name}\` in findings-${agent}](${RUN_URL}))`);
            if (findings) {
              findings.summary = shots(findings.summary);
              for (const comment of findings.comments) comment.body = shots(comment.body);
              for (const issue of findings.issues) issue.body = shots(issue.body);
            }
            const state = !findings ? 'error' : findings.verdict === 'approved' ? 'success' : 'failure';
            await post(`repos/${repo}/statuses/${SHA}`, {
              state,
              context: `review / ${agent}`,
              description: (findings?.summary ?? 'no findings').slice(0, 140),
              target_url: RUN_URL,
            });
            if (!findings) continue;
            const marker = `<!-- slicc-review:${agent} -->`;
            const summary = `${marker}\n**${agent}: ${findings.verdict}** on ${SHA.slice(0, 7)}\n\n${findings.summary}`;
            const sticky = said.find((comment) => comment.body.startsWith(marker));
            await (sticky ? call('PATCH', `repos/${repo}/issues/comments/${sticky.id}`, { body: summary }) : post(`repos/${repo}/issues/${PR}/comments`, { body: summary }));
            for (const { path, line, body } of findings.comments) {
              const text = `**${agent}:** ${body}`;
              const fallback = `**${agent}** on \`${path}:${line}\`: ${body}`;
              if (inline.some((comment) => comment.path === path && comment.body === text)) continue;
              await post(`repos/${repo}/pulls/${PR}/comments`, { commit_id: SHA, path, line, side: 'RIGHT', body: text })
                .catch(() => once(fallback, () => post(`repos/${repo}/issues/${PR}/comments`, { body: fallback })));
            }
            for (const issue of findings.issues) {
              const target = issue.repo || repo;
              if (target.split('/')[0] !== repo.split('/')[0]) {
                console.log(`skipped an issue for ${target}, outside ${repo.split('/')[0]}: ${issue.title}`);
                continue;
              }
              const token = target === repo ? GH_TOKEN : ISSUES_TOKEN || GH_TOKEN;
              const open = await pages(`repos/${target}/issues?state=open`, token).catch(() => []);
              const same = open.find((existing) => existing.title.trim().toLowerCase() === issue.title.trim().toLowerCase());
              if (same) {
                console.log(`already open: ${same.html_url}`);
                continue;
              }
              await post(`repos/${target}/issues`, { title: issue.title, body: `${issue.body}\n\nFrom ${agent}'s review of ${repo}#${PR}.` }, token)
                .then((created) => console.log(created.html_url))
                .catch(async (error) => {
                  console.error(error.message);
                  if (target === repo) {
                    failed = true;
                    return;
                  }
                  const note = `**${agent}** wanted to open an issue in ${target} but couldn't (${ISSUES_TOKEN ? 'SLICC_ISSUES_TOKEN was refused' : 'no SLICC_ISSUES_TOKEN'}):\n\n### ${issue.title}\n\n${issue.body}`;
                  await once(note, () => post(`repos/${repo}/issues/${PR}/comments`, { body: note }));
                });
            }
          }
          process.exit(failed ? 1 : 0);
          EOF

  review:
    needs: [lint, integration, reviewer]
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !cancelled()
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || inputs.runs-on }}
    steps:
      - if: needs.lint.outputs.review == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: findings-claude
          path: findings/findings-claude

      - if: needs.lint.outputs.review == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          name: findings-codex
          path: findings/findings-codex

      - env:
          EVENT: ${{ github.event_name }}
          REVIEW: ${{ needs.lint.outputs.review }}
          BEDROCK: ${{ needs.lint.outputs.bedrock }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            echo "merge queue: reviewed on the pull request"
            exit 0
          fi
          if [ "$REVIEW" = true ] && [ "$BEDROCK" != true ]; then
            if [ "$FORK" = true ]; then
              echo "::error title=Review::A pull request from a fork gets no secrets, so it can't be reviewed: open the change again from a branch in this repo"
            else
              echo "::error title=Review::AWS_BEARER_TOKEN_BEDROCK isn't available to this repo: add it to the org secret's repositories, then re-run"
            fi
            exit 1
          fi
          if [ "$REVIEW" != true ]; then
            echo "no review for this pull request: integration $INTEGRATION"
            test "$INTEGRATION" = success
            exit
          fi
          failed=0
          for agent in claude codex; do
            verdict=$(jq -r .verdict "findings/findings-$agent/findings.json" 2>/dev/null || true)
            echo "$agent: ${verdict:-no findings}"
            [ "$verdict" = approved ] || failed=1
          done
          exit "$failed"

  release:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.release-environment }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Release secrets as environment variables
        if: inputs.release-secrets != ''
        env:
          SECRETS: ${{ toJSON(secrets) }}
          RELEASE_SECRETS: ${{ inputs.release-secrets }}
        run: |
          node --input-type=module >> "$GITHUB_ENV" <<'EOF'
          const own = new Set(['github_token', 'AWS_BEARER_TOKEN_BEDROCK', 'SLICC_ISSUES_TOKEN', 'CLOUDFLARE_API_TOKEN']);
          const only = new Set(process.env.RELEASE_SECRETS.toUpperCase().split(/\s+/).filter(Boolean));
          for (const [key, value] of Object.entries(JSON.parse(process.env.SECRETS))) {
            if (!own.has(key) && only.has(key)) process.stdout.write(`${key}<<SLICC_EOF\n${value}\nSLICC_EOF\n`);
          }
          EOF

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shim="$RUNNER_TEMP/git-retry"
          mkdir -p "$shim"
          cat > "$shim/git" <<'EOF'
          #!/usr/bin/env node
          const { spawnSync } = require('node:child_process');
          const git = process.env.REAL_GIT;
          const args = process.argv.slice(2);
          const retry = ['push', 'fetch'].includes(args[0]) && !args.includes('--unshallow');
          const attempts = retry ? 5 : 1;
          const delay = Number(process.env.GIT_RETRY_DELAY_MS ?? 5000);
          for (let attempt = 1; ; attempt++) {
            const result = spawnSync(git, args, { stdio: 'inherit' });
            if (result.error) console.error(`git-retry: ${result.error.message}`);
            const status = result.status ?? 1;
            if (status === 0 || attempt === attempts) process.exit(status);
            console.error(`git-retry: git ${args[0]} failed, attempt ${attempt} of ${attempts}`);
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, delay * attempt);
          }
          EOF
          chmod +x "$shim/git"
          REAL_GIT="$(command -v git)" PATH="$shim:$PATH" npx semantic-release

      - id: released
        if: ${{ !cancelled() && inputs.attest != '' }}
        run: |
          git fetch --tags --force --quiet origin
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] || echo "no release on $GITHUB_SHA, so nothing to attest"

      - if: ${{ !cancelled() && inputs.attest != '' && steps.released.outputs.tag != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ inputs.attest }}

      - name: After release
        if: inputs.after-release != ''
        env:
          AFTER_RELEASE: ${{ inputs.after-release }}
        run: |
          git fetch --tags --force --quiet origin
          RELEASE_VERSION=$(git tag --points-at HEAD --list 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$RELEASE_VERSION" ]; then
            echo "no release on $GITHUB_SHA, so after-release doesn't run"
            exit 0
          fi
          export RELEASE_VERSION
          bash -eo pipefail -c "$AFTER_RELEASE"
