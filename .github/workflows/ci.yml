name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    if: github.event_name != 'push'
    uses: ./.github/workflows/pipeline.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: write
      statuses: write
      id-token: write
    with:
      shards: 1
      lint: |
        npm run lint
        # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
        ACTIONLINT=1.7.12
        bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v$ACTIONLINT/scripts/download-actionlint.bash") "$ACTIONLINT" "$RUNNER_TEMP" > /dev/null
        "$RUNNER_TEMP/actionlint" -color
        # renovate: datasource=npm depName=renovate
        RENOVATE=44.157.0
        npx --yes --package "renovate@$RENOVATE" -- renovate-config-validator --strict default.json renovate.json
