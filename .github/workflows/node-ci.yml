name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      lint:
        type: string
        default: npm run lint
      chromium:
        type: boolean
        default: true
      test:
        type: string
        default: npm test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        env:
          LINT: ${{ inputs.lint }}
        run: bash -c "$LINT"

      - name: Chromium system dependencies
        if: inputs.chromium
        run: npx playwright-core install-deps chromium

      - name: Integration tests with coverage, CPU profiles, and screenshots
        env:
          TEST: ${{ inputs.test }}
        run: bash -c "$TEST"

      - name: Hotspots
        if: always()
        run: cat artifacts/hotspots.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Crash dumps
        if: always()
        run: |
          script=node_modules/.bin/slicc-minidump
          [ -x "$script" ] || script=bin/slicc-minidump.mjs
          find artifacts -name '*.dmp' 2>/dev/null | while read -r dump; do
            report="${dump%.dmp}.txt"
            node "$script" "$dump" > "$report" 2>&1 || true
            {
              printf '### Crash dump %s\n\n~~~\n' "$dump"
              sed -n '1,/^modules:$/p' "$report" | head -100
              printf '~~~\n\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-profiles-screenshots
          path: |
            coverage/
            artifacts/
          if-no-files-found: ignore
