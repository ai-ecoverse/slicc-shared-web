name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      lint:
        type: string
        default: npm run lint
      chromium:
        type: boolean
        default: true
      chromium-cache:
        type: boolean
        default: true
      test:
        type: string
        default: npm test
      timeout-minutes:
        type: number
        default: 20
      runs-on:
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        env:
          LINT: ${{ inputs.lint }}
        run: bash -c "$LINT"

      - name: Chromium system dependencies
        if: inputs.chromium
        run: |
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then
            npx playwright-core install-deps chromium
          else
            echo "::notice title=Chromium system dependencies::No root on $RUNNER_NAME, so install-deps is skipped and the runner image's system libraries serve Chromium."
          fi

      - name: Playwright browser cache key
        id: playwright
        if: inputs.chromium && inputs.chromium-cache
        run: |
          if [ "${PLAYWRIGHT_BROWSERS_PATH:-}" = 0 ]; then
            exit 0
          fi
          echo "version=$(node -p "require('./package-lock.json').packages?.['node_modules/playwright-core']?.version ?? ''")" >> "$GITHUB_OUTPUT"
          if [ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ]; then
            echo "path=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = macOS ]; then
            echo "path=$HOME/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT"
          else
            echo "path=${XDG_CACHE_HOME:-$HOME/.cache}/ms-playwright" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.playwright.outputs.version != ''
        with:
          path: ${{ steps.playwright.outputs.path }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Integration tests with coverage, CPU profiles, and screenshots
        env:
          TEST: ${{ inputs.test }}
        run: bash -c "$TEST"

      - name: Hotspots
        if: always()
        run: cat artifacts/hotspots.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Crash dumps
        if: always()
        run: |
          script=node_modules/.bin/slicc-minidump
          [ -x "$script" ] || script=bin/slicc-minidump.mjs
          find artifacts -name '*.dmp' 2>/dev/null | while read -r dump; do
            report="${dump%.dmp}.txt"
            node "$script" "$dump" > "$report" 2>&1 || true
            {
              printf '### Crash dump %s\n\n~~~\n' "$dump"
              sed -n '1,/^modules:$/p' "$report" | head -100
              printf '~~~\n\n'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-profiles-screenshots
          path: |
            coverage/
            artifacts/
          if-no-files-found: ignore

      - name: Memory peak
        if: always()
        continue-on-error: true
        env:
          SLICC_RUNNER_NAME: ${{ runner.name }}
        run: |
          script=node_modules/.bin/slicc-memory-peak
          [ -x "$script" ] || script=bin/slicc-memory-peak.sh
          if [ -f "$script" ]; then
            sh "$script" || true
          else
            echo "memory peak n/a (no slicc-memory-peak), nproc $(nproc 2>/dev/null || echo n/a), runner $SLICC_RUNNER_NAME" | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
