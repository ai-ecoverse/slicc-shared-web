name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      lint:
        type: string
        default: npm run lint
      chromium:
        type: boolean
        default: true
      test:
        type: string
        default: npm test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        env:
          LINT: ${{ inputs.lint }}
        run: bash -c "$LINT"

      - name: Install Chromium
        if: inputs.chromium
        run: npx playwright-core install --with-deps --no-shell chromium

      - name: Integration tests with coverage, CPU profiles, and screenshots
        env:
          TEST: ${{ inputs.test }}
        run: bash -c "$TEST"

      - name: Hotspots
        if: always()
        run: cat artifacts/hotspots.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-profiles-screenshots
          path: |
            coverage/
            artifacts/
          if-no-files-found: ignore
