name: cert-review

on:
  workflow_call:
    inputs:
      tools-ref:
        description: The slicc-shared-web commit this workflow is called at (the same 40-hex sha as the caller's uses:); plan refuses a mismatch
        type: string
        required: true
      rules:
        description: The caller's certification rules (a non-.md text file, read from main), inserted into the shared review prompt
        type: string
        default: scripts/cert/review.txt
      quiet:
        description: Globs whose changes alone are not behaviour (tests, docs)
        type: string
        default: |
          test/**
          **/*.md
      loud:
        description: Globs that are behaviour even when a quiet glob matches them (the shipped tree)
        type: string
        default: |
          src/**
      guard-paths:
        description: cert-self-guard paths; keep every workflow and action, so no pull request can add its own check writer
        type: string
        default: |
          .github/workflows/**
          .github/actions/**
          scripts/cert/**
      injection-allow:
        description: Globs (test fixtures) where reviewer-aimed text is expected; read from main's caller, so a pull request can't add itself
        type: string
        default: ''
      approval-label:
        description: The coordinator's head-bound approval label that cert-self-guard reads
        type: string
        default: cert-review-approved
      workflow:
        description: The caller's workflow path; the merge group accepts only this workflow's runs
        type: string
        default: .github/workflows/cert-review.yml
      max-diff-lines:
        description: The largest annotated diff one review reads in full
        type: number
        default: 15000
      evidence-workflow:
        description: The caller's CI workflow file (for example ci.yml) whose pull_request run on the head, and push run on the base branch, the review reads as evidence; empty for none. It is part of the cert path
        type: string
        default: ''
      evidence-artifacts:
        description: Names (globs) of that workflow's artifacts to fetch, bound by id and digest
        type: string
        default: ''
      evidence-notes:
        description: Globs (artifact name / path inside it) whose text is upstream data, such as a dependency tarball's diff; an injection-shaped line there is a suspect note for the review, not a failure. Read from main's caller. Names and controls in file names still fail
        type: string
        default: ''
      evidence-wait-minutes:
        description: How long the evidence job waits for the head's run to finish (at most 200; the job times out at 240)
        type: number
        default: 120
      evidence-max-mb:
        description: The most artifact bytes the evidence job fetches (zipped), across both sides
        type: number
        default: 200
      code-check:
        description: A command the evidence job runs from the caller's tree at main (the head's on the bootstrap pull_request leg) after npm ci --ignore-scripts, with BASE_SHA (the merge base), HEAD_SHA and a read-only GH_TOKEN; a non-zero exit fails the check in code, and its output is evidence. Empty for none
        type: string
        default: ''
      light-runner:
        description: runs-on for every job (empty uses vars.CERT_LIGHT_RUNNER, then ubuntu-latest)
        type: string
        default: ''
    secrets:
      AWS_BEARER_TOKEN_BEDROCK:
        required: true

permissions:
  contents: read

env:
  LEFTHOOK: "0"
  APPROVAL: ${{ inputs.approval-label }}
  QUIET: ${{ inputs.quiet }}
  LOUD: ${{ inputs.loud }}
  GUARD_PATHS: ${{ inputs.guard-paths }}
  CERT_WORKFLOW: ${{ inputs.workflow }}
  CERT_TOOLS_REF: ${{ inputs.tools-ref }}
  CERT_MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
  INJECTION_ALLOW: ${{ inputs.injection-allow }}
  FALLBACK: |
    const e = process.env;
    const run = `${e.GITHUB_SERVER_URL}/${e.GITHUB_REPOSITORY}/actions/runs/${e.GITHUB_RUN_ID}/attempts/${e.GITHUB_RUN_ATTEMPT}`;
    const body = { state: 'failure', context: 'cert-review', description: `incomplete: ${e.STAGE}; re-run`, target_url: run };
    const head = { authorization: `Bearer ${e.GH_TOKEN}`, accept: 'application/vnd.github+json' };
    const seen = await fetch(`${e.GITHUB_API_URL}/repos/${e.GITHUB_REPOSITORY}/commits/${e.HEAD_SHA}/statuses?per_page=100`, { headers: head }).then((x) => (x.ok ? x.json() : [])).catch(() => []);
    if (seen.some((x) => x.context === 'cert-review' && x.target_url === run)) { console.log(`cert-review: this attempt already set its status on ${e.HEAD_SHA}`); process.exit(1); }
    const r = await fetch(`${e.GITHUB_API_URL}/repos/${e.GITHUB_REPOSITORY}/statuses/${e.HEAD_SHA}`, { method: 'POST', headers: { authorization: `Bearer ${e.GH_TOKEN}`, accept: 'application/vnd.github+json' }, body: JSON.stringify(body) });
    console.log(`cert-review: failure on ${e.HEAD_SHA} (incomplete: ${e.STAGE}), HTTP ${r.status}`);
    process.exit(1);


jobs:
  guard:
    name: self-guard
    if: github.event_name == 'merge_group' || (github.event.pull_request.head.repo.full_name == github.repository && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != inputs.approval-label) || (github.event.action == 'edited' && !github.event.changes.base)))
    runs-on: ${{ inputs.light-runner || vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: write
    outputs:
      status: ${{ steps.guard.outputs.status }}
      receipt: ${{ steps.guard.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The pull request's head, as data
        if: github.event_name != 'merge_group'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch -q --no-tags origin "$HEAD_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ai-ecoverse/slicc-shared-web
          ref: f342d7cf558c817ce517bbbbc4cc46df6eac2f97
          path: .cert-self-guard
          sparse-checkout: .github/actions/cert-self-guard
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - id: guard
        name: cert-self-guard v1.24.2, with pull_request_target read as the pull_request it carries
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_GUARD_PATHS: ${{ env.GUARD_PATHS }}
          CERT_GUARD_APPROVAL_LABEL: ${{ inputs.approval-label }}
        run: |
          event="$GITHUB_EVENT_NAME"
          [ "$event" = pull_request_target ] && event=pull_request
          [ "$event" = merge_group ] || [ "$event" = pull_request ] || { echo "cert-self-guard: INCOMPLETE event $event"; exit 1; }
          GITHUB_EVENT_NAME="$event" node .cert-self-guard/.github/actions/cert-self-guard/guard.mjs

  plan:
    name: plan
    needs: guard
    if: ${{ !cancelled() && github.event_name != 'merge_group' && !(((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != inputs.approval-label) || (github.event.action == 'edited' && !github.event.changes.base)) }}
    runs-on: ${{ inputs.light-runner || vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      conclusion: ${{ steps.plan.outputs.conclusion }}
      title: ${{ steps.plan.outputs.title }}
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The pull request's head, as data
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch -q --no-tags origin "$HEAD_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ai-ecoverse/slicc-shared-web
          ref: ${{ inputs.tools-ref }}
          path: .cert-tools
          sparse-checkout: .github/cert-review
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - id: plan
        name: Fork, draft, cert path, not behaviour, or review
        env:
          GUARD: ${{ needs.guard.outputs.status }}
          RECEIPT: ${{ needs.guard.outputs.receipt }}
        run: node .cert-tools/.github/cert-review/plan.mjs

  evidence:
    name: evidence
    needs: plan
    if: needs.plan.outputs.kind == 'review' && github.event.pull_request.head.repo.full_name == github.repository && (inputs.evidence-workflow != '' || inputs.code-check != '')
    runs-on: ${{ inputs.light-runner || vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
      reason: ${{ steps.fetch.outputs.reason }}
      hits: ${{ steps.fetch.outputs.hits }}
      code: ${{ steps.code.outputs.code }}
      code-line: ${{ steps.code.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ai-ecoverse/slicc-shared-web
          ref: ${{ inputs.tools-ref }}
          path: .cert-tools
          sparse-checkout: .github/cert-review
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - id: code
        name: The caller's code check, from main's tree, on the pull request's head as data
        if: inputs.code-check != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CODE_CHECK: ${{ inputs.code-check }}
          OUT: ${{ runner.temp }}/evidence
        run: |
          set -uo pipefail
          mkdir -p "$OUT"
          git fetch -q --no-tags origin "$HEAD_SHA" "$PR_BASE"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then git checkout -q --detach "$HEAD_SHA"; fi
          export BASE_SHA HEAD_SHA
          BASE_SHA=$(git merge-base "$PR_BASE" "$HEAD_SHA")
          code=0
          { [ ! -f package-lock.json ] || npm ci --ignore-scripts --no-audit --no-fund; } > "$RUNNER_TEMP/code-check-install.log" 2>&1 || code=$?
          if [ "$code" = 0 ]; then bash -c "$CODE_CHECK" > "$OUT/code-check.txt" 2>&1 || code=$?; else cp "$RUNNER_TEMP/code-check-install.log" "$OUT/code-check.txt"; fi
          tail -c 20000 "$OUT/code-check.txt"
          echo "code-check: exit $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          line=$(grep -v '^[[:space:]]*$' "$OUT/code-check.txt" | grep -m1 -E '^[a-z-]+: (FAIL|PASS|INCOMPLETE)' || tail -n1 "$OUT/code-check.txt")
          printf 'line=%s\n' "$(printf '%s' "$line" | tr -d '\000-\037' | cut -c1-600)" >> "$GITHUB_OUTPUT"

      - id: fetch
        if: inputs.evidence-workflow != ''
        name: The evidence workflow's runs on the head and the base, their artifacts bound by id and digest (no pull-request code runs here)
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_EVIDENCE_WORKFLOW: ${{ inputs.evidence-workflow }}
          CERT_EVIDENCE_ARTIFACTS: ${{ inputs.evidence-artifacts }}
          CERT_EVIDENCE_NOTES: ${{ inputs.evidence-notes }}
          CERT_EVIDENCE_WAIT: ${{ inputs.evidence-wait-minutes }}
          CERT_EVIDENCE_MAX_MB: ${{ inputs.evidence-max-mb }}
          CERT_EVIDENCE_DIR: ${{ runner.temp }}/evidence
        run: node .cert-tools/.github/cert-review/evidence.mjs

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-review-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  review:
    name: review
    needs: [plan, evidence]
    if: ${{ !cancelled() && needs.plan.outputs.kind == 'review' && github.event.pull_request.head.repo.full_name == github.repository && (needs.evidence.result == 'success' || (needs.evidence.result == 'skipped' && inputs.evidence-workflow == '' && inputs.code-check == '')) }}
    runs-on: ${{ inputs.light-runner || vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The pull request's head, as data
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch -q --no-tags origin "$HEAD_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ai-ecoverse/slicc-shared-web
          ref: ${{ inputs.tools-ref }}
          path: .cert-tools
          sparse-checkout: .github/cert-review
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - if: inputs.evidence-workflow != '' || inputs.code-check != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.evidence.outputs.id }}
          path: ${{ runner.temp }}/cert/evidence
          digest-mismatch: error

      - id: diff
        name: The annotated diff and main's prompt
        shell: bash
        env:
          CERT_DIR: ${{ runner.temp }}/cert
          CERT_EVIDENCE_DIR: ${{ (inputs.evidence-workflow != '' || inputs.code-check != '') && format('{0}/cert/evidence', runner.temp) || '' }}
          CERT_EVIDENCE_FETCH: ${{ inputs.evidence-workflow != '' }}
          CERT_CODE_CHECK: ${{ inputs.code-check != '' }}
          CERT_PROMPT: .cert-tools/.github/cert-review/frame.txt
          CERT_RULES: ${{ inputs.rules }}
        run: |
          node .cert-tools/.github/cert-review/diff.mjs
          schema=$(node -e 'process.stdout.write(JSON.stringify(require("./.cert-tools/.github/cert-review/verdict.schema.json")))')
          echo "schema=$schema" >> "$GITHUB_OUTPUT"

      - name: The review step's environment holds no GitHub token (names only)
        env:
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
        run: |
          names=$(env | cut -d= -f1 | sort -u)
          printf '%s\n' "$names" | tr '\n' ' '
          echo
          bad=$(printf '%s\n' "$names" | grep -Ex 'GITHUB_TOKEN|GH_TOKEN|ACTIONS_RUNTIME_TOKEN|ACTIONS_ID_TOKEN_REQUEST_TOKEN|ACTIONS_ID_TOKEN_REQUEST_URL' || true)
          if [ -n "$bad" ]; then echo "review-env: FAIL $bad"; exit 1; fi
          echo "review-env: PASS no GitHub or Actions token among the step's variables"

      - id: claude
        name: Review, read-only, without a token that can write
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
        with:
          use_bedrock: "true"
          prompt_file: ${{ runner.temp }}/cert/prompt.txt
          claude_args: |
            --model ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
            --add-dir ${{ runner.temp }}/cert
            --permission-mode dontAsk
            --allowedTools "Read(/${{ github.workspace }}/**),Glob(/${{ github.workspace }}/**),Grep(/${{ github.workspace }}/**),Read(/${{ runner.temp }}/cert/**),Glob(/${{ runner.temp }}/cert/**),Grep(/${{ runner.temp }}/cert/**)"
            --disallowedTools "Bash,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,Agent,Read(//proc/**),Read(//sys/**),Read(//dev/**),Read(//etc/**),Read(//run/**),Read(//var/**),Read(//tmp/**)"
            --json-schema '${{ steps.diff.outputs.schema }}'
            --max-turns 80

      - name: The verdict, exactly as the review returned it
        env:
          VERDICT: ${{ steps.claude.outputs.structured_output }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/verdict"
          echo "review: $OUTCOME"
          if [ "$OUTCOME" = success ] && [ -n "$VERDICT" ]; then printf '%s' "$VERDICT" > "$RUNNER_TEMP/verdict/verdict.json"; else echo "the review returned no verdict"; fi

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-review-verdict
          path: ${{ runner.temp }}/verdict/verdict.json
          if-no-files-found: ignore
          overwrite: true

  post:
    name: post
    needs: [plan, evidence, review]
    if: ${{ !cancelled() && needs.plan.result != 'skipped' && needs.plan.outputs.kind != 'noop' }}
    runs-on: ${{ inputs.light-runner || vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The pull request's head, as data
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch -q --no-tags origin "$HEAD_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ai-ecoverse/slicc-shared-web
          ref: ${{ inputs.tools-ref }}
          path: .cert-tools
          sparse-checkout: .github/cert-review
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - id: artifacts
        name: The run's only verdict artifact is the one the review job uploaded
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_ID: ${{ needs.review.outputs.id }}
          EXPECT_DIGEST: ${{ needs.review.outputs.digest }}
        run: node .cert-tools/.github/cert-review/artifacts.mjs

      - id: evidence
        name: The run's only evidence artifact is the one the evidence job uploaded
        if: inputs.evidence-workflow != '' || inputs.code-check != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_ARTIFACT_PREFIX: cert-review-evidence
          EXPECT_ID: ${{ needs.evidence.outputs.id }}
          EXPECT_DIGEST: ${{ needs.evidence.outputs.digest }}
        run: node .cert-tools/.github/cert-review/artifacts.mjs

      - if: needs.review.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.review.outputs.id }}
          path: ${{ runner.temp }}/verdict
          digest-mismatch: error

      - id: post
        name: Validate the verdict, post the review, set the cert-review check
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SECRETS: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          ARTIFACTS: ${{ steps.artifacts.outcome }}
          VERDICT: ${{ runner.temp }}/verdict/verdict.json
          KIND: ${{ needs.plan.outputs.kind }}
          EVIDENCE_WANTED: ${{ inputs.evidence-workflow != '' || inputs.code-check != '' }}
          FETCH_WANTED: ${{ inputs.evidence-workflow != '' }}
          CODE_WANTED: ${{ inputs.code-check != '' }}
          CODE_EXIT: ${{ needs.evidence.outputs.code }}
          CODE_LINE: ${{ needs.evidence.outputs.code-line }}
          EVIDENCE: ${{ needs.evidence.result }}
          EVIDENCE_REASON: ${{ needs.evidence.outputs.reason }}
          EVIDENCE_HITS: ${{ needs.evidence.outputs.hits }}
          EVIDENCE_ARTIFACT: ${{ steps.evidence.outcome }}
          CONCLUSION: ${{ needs.plan.outputs.conclusion }}
          TITLE: ${{ needs.plan.outputs.title }}
          SUMMARY: ${{ needs.plan.outputs.summary }}
        run: node .cert-tools/.github/cert-review/post.mjs

      - name: A post that set no check still sets one, so cert-review never waits forever
        if: (failure() || cancelled()) && steps.post.outputs.checked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STAGE: post
        run: node --input-type=module -e "$FALLBACK"

  group:
    name: merge group
    needs: guard
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ${{ inputs.light-runner || vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ai-ecoverse/slicc-shared-web
          ref: ${{ inputs.tools-ref }}
          path: .cert-tools
          sparse-checkout: .github/cert-review
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24

      - id: group
        name: Every member has a cert-review success on its head from this workflow, in code
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD: ${{ needs.guard.outputs.status }}
          RECEIPT: ${{ needs.guard.outputs.receipt }}
        run: node .cert-tools/.github/cert-review/group.mjs

      - name: A lookup that set no check still sets one, so cert-review never waits forever
        if: (failure() || cancelled()) && steps.group.outputs.checked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: group
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          STAGE: merge-group lookup
        run: node --input-type=module -e "$FALLBACK"
