assert_lefthook_installed: true
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,json,css,html}"
      run: npx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: typecheck
      glob: "*.ts"
      run: npm run --silent typecheck
    - name: no comments
      run: npx --no-install slicc-lint-comments
    - name: no unit tests in git
      run: npx --no-install slicc-no-unit-tests
    - name: AGENTS.md
      run: npx --no-install slicc-agents-md
    - name: diff coverage
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx}"
      run: npx --no-install slicc-unit-cover
